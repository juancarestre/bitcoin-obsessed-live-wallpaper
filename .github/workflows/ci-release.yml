name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_repository.py
      - run: python3 scripts/scan_secrets.py

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npm test
        working-directory: backend

  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Use non-production Firebase configuration
        run: cp app/google-services.example.json app/google-services.json
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug -PbackendUrl=https://example.invalid

  release:
    name: Publish signed APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [hygiene, backend, android]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Per-commit group: never cancel or replace a different merge's release.
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - id: version
        run: python3 scripts/release_version.py
      - name: Restore private build configuration
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name, path in [('FIREBASE_CONFIG_BASE64', Path('app/google-services.json')),
                             ('RELEASE_KEYSTORE_BASE64', Path(os.environ['RUNNER_TEMP']) / 'release.keystore')]:
              value = os.environ.get(name)
              if not value:
                  raise SystemExit(f'Missing release secret: {name}')
              path.write_bytes(base64.b64decode(value, validate=True))
              path.chmod(0o600)
          PY
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build signed release
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify and package APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk --version "$VERSION" --code "$CODE"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/bitcoin-obsessed-v$VERSION.apk"
          cd dist
          sha256sum "bitcoin-obsessed-v$VERSION.apk" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: python3 scripts/publish_release.py
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" app/google-services.json
